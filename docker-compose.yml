# docker-compose.yml — production
# NOTE: NEXT_PUBLIC_* vars are baked at build time.
# For production, set these to your public-facing URLs (not internal Docker network).
# Example: NEXT_PUBLIC_API_URL=https://api.yourdomain.com
version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - chroma_data:/app/chroma_data
      - ./backend/app.db:/app/app.db
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      args:
        # IMPORTANT: Set these to PUBLIC URLs that browsers can reach
        # NOT internal Docker network URLs like http://backend:8000
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${PUBLIC_WS_URL:-ws://localhost:8000}
        NEXT_PUBLIC_SELLER_ID: ${SELLER_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
